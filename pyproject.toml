[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cad-project-archiver"
version = "1.1.0"
description = "Lossless engineering project preservation with verified ZIP archives"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Nokuthaba Moyo"}]

[project.scripts]
cad-archive = "cad_archiver.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
